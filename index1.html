<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card UI Design </title>
   <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="profile-card">
    <div class="image">
        <img src="tushar.jpg.jpeg" alt="" class="profile-img">
    </div>
    <div class="text-data">
        <span class="name">Code Orbit</span>
        <span class="job">Web developer & Bloger</span>
    </div>

    <div class="media-buttons">
        <a href="#" class="links">
            <img width="48" height="48" src="https://img.icons8.com/color/48/facebook-new.png" alt="facebook-new"/>
        </a>
        <a href="#" class="links">
           <img width="48" height="48" src="https://img.icons8.com/color/48/twitter--v1.png" alt="twitter--v1"/>
        </a>
        <a href="#" class="links">
           <img width="48" height="48" src="https://img.icons8.com/fluency/48/instagram-new.png" alt="instagram-new"/>
        </a>
        <a href="#" class="links">
            <img width="48" height="48" src="https://img.icons8.com/color/48/youtube-play.png" alt="youtube-play"/>
        </a>
    </div>

    <div class="buttons">
      <button class="button">Subscribe</button>
      <button class="button">Message</button>
    </div>

    <div class="heart">
        <div class="data">
            <img width="19" height="19" src="https://img.icons8.com/ios/50/like--v1.png" alt="like--v1"/>
            <span>60k</span>
        </div>
        <div class="data">
            <img width="19" height="19" src="https://img.icons8.com/ios/50/topic--v1.png" alt="topic--v1"/>
            <span>15.73k</span>
        </div>
        <div class="data">
            <img width="19" height="19" src="https://img.icons8.com/ios-glyphs/30/share--v1.png" alt="share--v1"/>
            <span>10.9k</span>
        </div>
    </div>
  </div>
    
</body>
</html>
