<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styletr.css">
    <title>TRANSFORM EFFECTS</title>
</head>
<body>
    <div class="container">
        <div class="boX">
            <div class="color translatex">
             Translate X
            </div>
        </div>

        <div class="boX">
            <div class="color translatey">
                Translate Y
            </div>
        </div>

        <div class="boX">
            <div class="color translate">
                Translate
            </div>
        </div>

        <div class="boX">
            <div class="color translatez">
                Translate Z
            </div>
        </div>

        <div class="boX">
            <div class="color translate3d">
                Translate 3D
            </div>
        </div>

        <div class="boX">
            <div class="color rotate">
                Rotate
            </div>
        </div>

        <div class="boX">
            <div class="color rotatex">
                Rotate X
            </div>
        </div>

        <div class="boX">
            <div class="color rotatey">
                Rotate Y
            </div>
        </div>

        <div class="boX">
            <div class="color scale ">
                Scale 
            </div>
        </div>

        <div class="boX">
            <div class="color scalex">
                Scale X
            </div>
        </div>

        <div class="boX">
            <div class=" color scaley">
                Scale Y
            </div>
        </div>
        <div class="boX">
            <div class="skew color">
                Skew
            </div>
        </div>

        <div class="boX">
            <div class="color skewx">
                Skew X
            </div>
        </div>

        <div class="boX">
            <div class="color skewy">
                Skew Y
            </div>
        </div>

        <div class="boX">
            <div class="color matrix">
                Matrix
            </div>
        </div>

        <div class="boX">
            <div class="matrix3d color">
                Matrix 3D
            </div>
        </div>

    </div>
    
</body>
</html>
